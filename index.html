<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameLab Generator</title>
    <!-- ... (Style tetap sama agar tampilan tidak berubah) ... -->
    <style>
        :root { --bg-color: #0a0e17; --card-bg: #111827; --text-main: #f3f4f6; --accent: #8b5cf6; --border: #1f2937; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .generator-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; width: 100%; max-width: 600px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 16px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; }
        #generateBtn { background: var(--accent); }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .result-item { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <div class="generator-box">
        <h1>NameLab</h1>
        <input type="text" id="inputKeyword" placeholder="Masukkan kata kunci (contoh: front, loop, bee)...">
        <div class="btn-group">
            <button id="generateBtn" onclick="generateNames()">Generate</button>
            <button id="resetBtn" onclick="resetForm()" style="background:#374151">Reset</button>
        </div>
    </div>

    <div class="results-box" id="resultsContainer" style="display: none; width: 100%; max-width: 600px;">
        <div id="results"></div>
    </div>

    <script>
        // Logika Pintar: Kita buat database transformasi kata
        const patterns = {
            'front': ['frontal', 'frontline', 'frontlord', 'gufront', 'frontman', 'afront', 'frontix'],
            'loop': ['loopie', 'looper', 'villoop', 'loopster', 'loopify', 'loopz', 'gloope'],
            'bee': ['bumblebee', 'killerbee', 'beecore', 'honeebee', 'beez', 'queenbee', 'beemaster'],
            'shadow': ['shadown', 'shadowy', 'shadox', 'vshadow', 'shadowist', 'shadowlab']
        };

        function generateNames() {
            const kw = document.getElementById('inputKeyword').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            if (!kw) return alert('Masukkan kata kunci!');

            let suggestions = [];

            // Jika kata kunci ada di database kita
            if (patterns[kw]) {
                suggestions = patterns[kw];
            } else {
                // Fallback: Jika kata tidak ada, buat variasi otomatis yang lebih masuk akal
                suggestions = [
                    kw + 'ie', kw + 'er', 'vil' + kw, kw + 'ify', 
                    'a' + kw, kw + 'z', kw + 'core', 'neo' + kw
                ];
            }

            suggestions.forEach(name => {
                const el = document.createElement('div');
                el.className = 'result-item';
                el.textContent = name;
                resultsDiv.appendChild(el);
            });
            document.getElementById('resultsContainer').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('inputKeyword').value = '';
            document.getElementById('resultsContainer').style.display = 'none';
        }
    </script>
</body>
</html>
